<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>堆高機Forklift</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&family=Oswald&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .top {
            flex: 0 0 auto;
            background-color: #f1f1f1;
            padding: 10px 15px;
            box-sizing: border-box;
            font-family: 'Oswald', sans-serif;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: nowrap;
            border-bottom: 2px solid #ddd;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            margin-right: 20px;
            color: #333;
            flex-shrink: 0;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: nowrap;
            flex-shrink: 0;
        }

        .link {
            display: inline-block;
            flex-shrink: 0;
        }

        .link a {
            text-decoration: none;
            color: #0066cc;
            font-size: 16px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background-color 0.3s;
            white-space: nowrap;
            background-color: rgba(255, 255, 255, 0.5);
        }

        .link a:hover {
            background-color: #e0e0e0;
        }

        .link a:active {
            background-color: #d0d0d0;
        }

        .middle {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 平板橫向 */
        @media screen and (max-width: 1024px) and (orientation: landscape) {
            .brand {
                font-size: 20px;
            }

            .link a {
                font-size: 15px;
                padding: 5px 10px;
            }

            .top {
                padding: 8px 12px;
            }
        }

        /* 平板直向 */
        @media screen and (max-width: 768px) and (orientation: portrait) {
            body,
            html {
                height: auto;
                min-height: 100%;
                overflow: auto;
            }

            .container {
                height: auto;
                min-height: 100%;
            }

            .top {
                padding: 8px 10px;
            }

            .brand {
                font-size: 18px;
                margin-right: 10px;
            }

            .nav-links {
                gap: 10px;
            }

            .link a {
                font-size: 14px;
                padding: 5px 10px;
            }

            .middle {
                flex: none;
                height: calc(100vh - 60px);
                overflow: auto;
            }

            iframe {
                height: 100%;
                min-height: 700px;
            }
        }

        /* 手機橫向 */
        @media screen and (max-width: 767px) and (orientation: landscape) {
            body,
            html {
                height: auto;
                min-height: 100%;
                overflow: auto;
            }

            .container {
                height: auto;
                min-height: 100%;
            }

            .top {
                padding: 5px 10px;
            }

            .brand {
                font-size: 16px;
                margin-right: 10px;
            }

            .nav-links {
                gap: 8px;
            }

            .link a {
                font-size: 13px;
                padding: 4px 8px;
            }

            .middle {
                flex: none;
                height: calc(100vh - 50px);
                overflow: auto;
            }

            iframe {
                height: 100%;
                min-height: 400px;
            }
        }

        /* 手機直向 */
        @media screen and (max-width: 480px) and (orientation: portrait) {
            body,
            html {
                height: auto;
                min-height: 100%;
                overflow: auto;
            }

            .container {
                height: auto;
                min-height: 100%;
            }

            .top {
                padding: 10px 8px;
                min-height: 44px;
            }

            .brand {
                font-size: 15px;
                margin-right: 12px;
            }

            .nav-links {
                gap: 8px;
            }

            .link a {
                font-size: 13px;
                padding: 8px 10px;
            }

            .middle {
                flex: none;
                height: calc(100vh - 60px);
                overflow: auto;
            }

            iframe {
                height: 100%;
                min-height: 600px;
            }
        }

        /* 超小手機 */
        @media screen and (max-width: 360px) {
            body,
            html {
                height: auto;
                min-height: 100%;
                overflow: auto;
            }

            .container {
                height: auto;
                min-height: 100%;
            }

            .top {
                padding: 8px 6px;
                min-height: 40px;
            }

            .brand {
                font-size: 14px;
                margin-right: 10px;
            }

            .link a {
                font-size: 12px;
                padding: 6px 8px;
            }

            .nav-links {
                gap: 6px;
            }

            .middle {
                flex: none;
                height: calc(100vh - 56px);
                overflow: auto;
            }

            iframe {
                height: 100%;
                min-height: 600px;
            }
        }

        /* 觸控優化 */
        @media (hover: none) and (pointer: coarse) {
            .link a {
                min-height: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top">
            <div class="brand">Tailift</div>
            <div class="nav-links">
                <div class="link"><a href="Forklift/Pip_PU.html" target="content">堆高機</a></div>
                <div class="link"><a href="List.html" target="content">List</a></div>
                <div class="link"><a href="Component/Component.html" target="content">Component</a></div>
                <div class="link"><a href="OrderSystem/transaction.html" target="content">Transaction</a></div>
            </div>
        </div>
        <div class="middle">
            <iframe src="List.html" name="content"></iframe>
        </div>
    </div>
</body>
</html>
