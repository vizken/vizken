<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>堆高機零件瀏覽器 - PiP Switcher (RWD)</title>
<style>
  :root{ 
    --pad:14px; 
    --pip-w:360px; 
    --pip-h:240px;
    --panel-height: 60px;
  }
  
  * { box-sizing: border-box; }
  
  html,body{
    margin:0;
    height:100%;
    background:#0b1220;
    color:#e5e7eb;
    font-family:system-ui,-apple-system,Segoe UI,Roboto;
    overflow:hidden;
  }
  
  #main{
    position:fixed; 
    inset:0; 
    width:100%; 
    height:100%; 
    border:0; 
    background:#0b1220;
  }

  #pip{ 
    position:fixed; 
    right:var(--pad); 
    bottom:calc(var(--pad) + var(--panel-height));
    width:var(--pip-w); 
    height:var(--pip-h);
    background:#0b1220; 
    border:1px solid #283449; 
    border-radius:12px; 
    overflow:hidden;
    box-shadow: 0 6px 30px rgba(0,0,0,.45); 
    transition:all 0.3s ease;
    z-index: 100;
  }
  
  #pip iframe{ 
    width:100%; 
    height:100%; 
    border:0; 
    display:block; 
    border-radius:inherit; 
  }
  
  .size-handle{ 
    position:absolute; 
    right:6px; 
    bottom:6px; 
    width:20px; 
    height:20px; 
    cursor:nwse-resize;
    border-right:2px solid #64748b; 
    border-bottom:2px solid #64748b; 
    opacity:.9;
    touch-action: none;
  }

  #pip.fullscreen {
    top:0 !important; 
    left:0 !important; 
    right:0 !important; 
    bottom:var(--panel-height) !important;
    width:100% !important; 
    height:auto !important; 
    border-radius:0 !important;
  }

  .panel {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: auto;
    min-height: var(--panel-height);
    background: rgba(12,18,32,.95);
    border-top: 1px solid #263248;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 12px;
    font-size: 14px;
    backdrop-filter: blur(6px) saturate(1.2);
    box-shadow: 0 -4px 20px rgba(0,0,0,.35);
    overflow-y: auto;
    max-height: 40vh;
    z-index: 200;
  }
  
  .panel.collapsed {
    height: 50px;
    overflow: hidden;
  }
  
  .row{ 
    display:flex; 
    align-items:center; 
    gap:8px;
    flex-wrap: wrap;
  }
  
  .btn{ 
    padding:8px 12px; 
    border-radius:8px; 
    border:1px solid #374151; 
    background:#111827; 
    color:#e5e7eb; 
    cursor:pointer;
    white-space: nowrap;
    touch-action: manipulation;
    min-height: 36px;
    font-size: 14px;
  }
  
  .btn:hover{ 
    background:#0f172a; 
  }
  
  .btn:active {
    transform: scale(0.98);
  }
  
  select, input[type="range"]{ 
    background:#0b1220; 
    color:#e5e7eb; 
    border:1px solid #374151; 
    border-radius:8px; 
    padding:6px 8px;
    min-height: 36px;
  }
  
  select {
    min-width: 120px;
  }
  
  input[type="range"] {
    min-width: 80px;
    flex: 1;
    max-width: 150px;
  }
  
  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
  }
  
  .small{ 
    font-size:12px; 
    opacity:.8;
  }
  
  #togglePanel {
    display: none;
    position: fixed;
    bottom: 8px;
    right: 8px;
    z-index: 201;
    padding: 10px 16px;
    background: rgba(17,24,39,.95);
    border: 1px solid #374151;
    border-radius: 20px;
    font-size: 20px;
    backdrop-filter: blur(6px);
  }

  /* ==================== 平板尺寸 ==================== */
  @media (max-width: 768px) {
    :root {
      --pip-w: 280px;
      --pip-h: 187px;
      --pad: 10px;
    }
    
    .panel {
      gap: 10px;
      padding: 10px;
      font-size: 13px;
      max-height: 50vh;
    }
    
    .btn {
      padding: 6px 10px;
      font-size: 13px;
      min-height: 32px;
    }
    
    select, input[type="range"] {
      font-size: 13px;
      padding: 5px 7px;
      min-height: 32px;
    }
    
    .row {
      gap: 6px;
    }
    
    #pip {
      bottom: calc(var(--pad) + 50px);
    }
    
    .size-handle {
      width: 24px;
      height: 24px;
      right: 4px;
      bottom: 4px;
    }
  }

  /* ==================== 手機尺寸 ==================== */
  @media (max-width: 480px) {
    :root {
      --pip-w: 200px;
      --pip-h: 133px;
      --pad: 8px;
      --panel-height: 50px;
    }
    
    #togglePanel {
      display: block;
    }
    
    .panel {
      transform: translateY(100%);
      transition: transform 0.3s ease;
      gap: 8px;
      padding: 12px 8px;
      font-size: 12px;
      border-radius: 16px 16px 0 0;
    }
    
    .panel.show {
      transform: translateY(0);
    }
    
    .btn {
      padding: 6px 8px;
      font-size: 12px;
      min-height: 32px;
    }
    
    select {
      font-size: 12px;
      padding: 4px 6px;
      min-width: 100px;
      min-height: 32px;
    }
    
    input[type="range"] {
      min-width: 60px;
      max-width: 100px;
    }
    
    .row {
      width: 100%;
      justify-content: space-between;
    }
    
    .row:has(button[data-size]) {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    
    .row:has(button[data-size]) .btn {
      padding: 6px 4px;
    }
    
    label {
      font-size: 12px;
    }
    
    #pip {
      bottom: 70px;
    }
    
    #pip:not(.fullscreen) {
      max-width: calc(100vw - 16px);
      max-height: calc(100vh - 150px);
    }
    
    .size-handle {
      width: 28px;
      height: 28px;
      border-width: 3px;
    }
  }

  /* ==================== 超小手機 ==================== */
  @media (max-width: 360px) {
    :root {
      --pip-w: 160px;
      --pip-h: 107px;
    }
    
    .btn {
      padding: 5px 6px;
      font-size: 11px;
    }
    
    select, input[type="range"] {
      font-size: 11px;
    }
    
    .small {
      font-size: 10px;
    }
  }

  /* ==================== 橫向模式 ==================== */
  @media (max-height: 500px) and (orientation: landscape) {
    :root {
      --panel-height: 50px;
    }
    
    #togglePanel {
      display: block;
    }
    
    .panel {
      transform: translateY(100%);
      transition: transform 0.3s ease;
      max-height: 60vh;
      padding: 8px;
      border-radius: 16px 16px 0 0;
    }
    
    .panel.show {
      transform: translateY(0);
    }
    
    #pip:not(.fullscreen) {
      max-height: 35vh;
    }
    
    #pip {
      bottom: 70px;
    }
  }

  /* ==================== 觸控設備優化 ==================== */
  @media (hover: none) and (pointer: coarse) {
    .btn, select, input[type="checkbox"] {
      min-height: 40px;
    }
    
    .size-handle {
      width: 32px;
      height: 32px;
      border-width: 3px;
    }
    
    #pip {
      touch-action: none;
    }
  }
</style>
</head>
<body>
  <iframe id="main" src="Push-1101.html" allow="xr; autoplay; fullscreen"></iframe>

  <div id="pip">
    <iframe id="pipFrame" src="前叉A.html" allow="xr; autoplay; fullscreen"></iframe>
    <div class="size-handle" id="sizeHandle" title="拖曳以改變大小"></div>
  </div>

  <button class="btn" id="togglePanel">☰</button>

  <div class="panel" id="panel">
    <div class="row">
      <label for="srcSel">PiP來源:</label>
      <select id="srcSel">
        <option value="前叉A.html" selected>前叉</option>
        <option value="車架.html">車架</option>
        <option value="控制台.html">控制台</option>
        <option value="椅子.html">椅子</option>
        <option value="腳踏.html">腳踏</option>
        <option value="背車殼.html">背車殼</option>
        <option value="1019Pip_前右輪.html">前右輪</option>
        <option value="1019Pip_前左輪.html">前左輪</option>
        <option value="後右輪.html">後右輪</option>
        <option value="後左輪.html">後左輪</option>
      </select>
      <button class="btn" id="reload">重載</button>
    </div>
    
    <div class="row">
      <label><input type="checkbox" id="togglePip" checked> 顯示PiP</label>
      <label><input type="checkbox" id="clickThrough"> 滑鼠穿透</label>
    </div>
    
    <div class="row">
      <span class="small">透明度</span>
      <input type="range" id="opacity" min="30" max="100" value="100">
      <span class="small" id="opv">100%</span>
    </div>
    
    <div class="row">
      <button class="btn" data-size="240x160">小</button>
      <button class="btn" data-size="360x240">中</button>
      <button class="btn" data-size="480x320">大</button>
      <button class="btn" data-size="640x426">XL</button>
    </div>
    
    <div class="row">
      <button class="btn" id="toggleFS">⛶ 全螢幕</button>
    </div>
    
    <div class="row">
      <button class="btn" id="pinTL">↖</button>
      <button class="btn" id="pinTR">↗</button>
      <button class="btn" id="pinBL">↙</button>
      <button class="btn" id="pinBR">↘</button>
    </div>
  </div>

<script>
  const pip = document.getElementById('pip');
  const pipFrame = document.getElementById('pipFrame');
  const srcSel = document.getElementById('srcSel');
  const reloadBtn = document.getElementById('reload');
  const panel = document.getElementById('panel');
  const togglePanelBtn = document.getElementById('togglePanel');

  // 手機版面板切換
  togglePanelBtn.addEventListener('click', () => {
    panel.classList.toggle('show');
  });

  // 點擊面板外部時關閉 (手機直向與橫向)
  document.addEventListener('click', (e) => {
    const isMobilePortrait = window.innerWidth <= 480;
    const isMobileLandscape = window.innerHeight <= 500 && window.matchMedia('(orientation: landscape)').matches;
    
    if (isMobilePortrait || isMobileLandscape) {
      if (!panel.contains(e.target) && !togglePanelBtn.contains(e.target)) {
        panel.classList.remove('show');
      }
    }
  });

  // PiP來源切換
  const setSrc = (val) => { 
    pipFrame.src = val; 
    srcSel.value = val; 
  };
  
  srcSel.addEventListener('change', () => setSrc(srcSel.value));
  reloadBtn.addEventListener('click', () => pipFrame.src = pipFrame.src);

  // 顯示/隱藏PiP
  document.getElementById('togglePip').addEventListener('change', e => {
    pip.style.display = e.target.checked ? 'block' : 'none';
  });

  // 透明度控制
  const opacity = document.getElementById('opacity');
  const opv = document.getElementById('opv');
  const setOpacity = v => { 
    pip.style.opacity = (v/100).toString(); 
    opv.textContent = v + '%'; 
  };
  opacity.addEventListener('input', e => setOpacity(e.target.value));
  setOpacity(opacity.value);

  // 尺寸預設
  const setSize = (w, h) => { 
    if (pip.classList.contains('fullscreen')) return;
    pip.style.width = w + 'px'; 
    pip.style.height = h + 'px'; 
  };
  
  document.querySelectorAll('.btn[data-size]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [w, h] = btn.dataset.size.split('x').map(Number);
      setSize(w, h);
    });
  });

  // 位置固定
  const resetPin = () => { 
    pip.style.left = ''; 
    pip.style.top = ''; 
    pip.style.right = ''; 
    pip.style.bottom = ''; 
  };
  
  const panelHeight = window.innerWidth <= 480 ? 50 : 60;
  
  document.getElementById('pinTL').addEventListener('click', () => { 
    resetPin(); 
    pip.style.left = '14px'; 
    pip.style.top = '14px'; 
  });
  
  document.getElementById('pinTR').addEventListener('click', () => { 
    resetPin(); 
    pip.style.right = '14px'; 
    pip.style.top = '14px'; 
  });
  
  document.getElementById('pinBL').addEventListener('click', () => { 
    resetPin(); 
    pip.style.left = '14px'; 
    pip.style.bottom = (panelHeight + 14) + 'px'; 
  });
  
  document.getElementById('pinBR').addEventListener('click', () => { 
    resetPin(); 
    pip.style.right = '14px'; 
    pip.style.bottom = (panelHeight + 14) + 'px'; 
  });

  // 滑鼠穿透
  const clickThrough = document.getElementById('clickThrough');
  clickThrough.addEventListener('change', e => {
    pip.style.pointerEvents = e.target.checked ? 'none' : 'auto';
  });

  // 全螢幕切換
  const toggleFS = document.getElementById('toggleFS');
  toggleFS.addEventListener('click', () => {
    pip.classList.toggle('fullscreen');
    toggleFS.textContent = pip.classList.contains('fullscreen') ? '⛶ 退出全螢幕' : '⛶ 全螢幕';
  });

  // 拖曳功能
  (function dragPip() {
    let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    
    pip.addEventListener('pointerdown', (e) => {
      if (e.target.id === 'sizeHandle') return;
      if (pip.classList.contains('fullscreen')) return;
      
      dragging = true; 
      sx = e.clientX; 
      sy = e.clientY; 
      ox = pip.offsetLeft; 
      oy = pip.offsetTop;
      pip.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    
    pip.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      
      let newLeft = ox + e.clientX - sx;
      let newTop = oy + e.clientY - sy;
      
      // 邊界限制
      newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - pip.offsetWidth));
      newTop = Math.max(0, Math.min(newTop, window.innerHeight - pip.offsetHeight - panelHeight));
      
      pip.style.left = newLeft + 'px';
      pip.style.top = newTop + 'px';
      pip.style.right = '';
      pip.style.bottom = '';
    });
    
    pip.addEventListener('pointerup', () => dragging = false);
  })();

  // 調整大小功能
  (function resizePip() {
    const handle = document.getElementById('sizeHandle');
    let resizing = false, sx = 0, sy = 0, sw = 0, sh = 0;
    
    handle.addEventListener('pointerdown', (e) => {
      if (pip.classList.contains('fullscreen')) return;
      
      resizing = true; 
      sx = e.clientX; 
      sy = e.clientY; 
      sw = pip.offsetWidth; 
      sh = pip.offsetHeight;
      handle.setPointerCapture(e.pointerId);
      e.stopPropagation();
      e.preventDefault();
    });
    
    handle.addEventListener('pointermove', (e) => {
      if (!resizing) return;
      
      const dw = e.clientX - sx;
      const dh = e.clientY - sy;
      
      const minW = window.innerWidth <= 480 ? 120 : 160;
      const minH = window.innerWidth <= 480 ? 90 : 120;
      const maxW = window.innerWidth - 20;
      const maxH = window.innerHeight - panelHeight - 20;
      
      pip.style.width = Math.max(minW, Math.min(maxW, sw + dw)) + 'px';
      pip.style.height = Math.max(minH, Math.min(maxH, sh + dh)) + 'px';
    });
    
    handle.addEventListener('pointerup', () => resizing = false);
  })();

  // 鍵盤快捷鍵 (修正版)
  document.addEventListener('keydown', (e) => {
    // 如果焦點在輸入框或選擇框,不處理快捷鍵
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
    
    const key = e.key.toLowerCase();
    let handled = false;
    
    switch(key) {
      case '1': 
        setSrc('前叉A.html'); 
        handled = true;
        break;
      case '2': 
        setSrc('車架.html'); 
        handled = true;
        break;
      case '3': 
        setSrc('控制台.html'); 
        handled = true;
        break;
      case '4': 
        setSrc('椅子.html'); 
        handled = true;
        break;
      case 'h': 
        const togglePipCheckbox = document.getElementById('togglePip');
        togglePipCheckbox.checked = !togglePipCheckbox.checked;
        togglePipCheckbox.dispatchEvent(new Event('change'));
        handled = true;
        break;
      case 't': 
        clickThrough.checked = !clickThrough.checked;
        clickThrough.dispatchEvent(new Event('change'));
        handled = true;
        break;
      case 'f': 
        toggleFS.click();
        handled = true;
        break;
    }
    
    if (handled) {
      e.preventDefault();
      e.stopPropagation();
    }
  });

  // 響應式調整
  let resizeTimer;
  let wasMobile = window.innerWidth <= 480;
  let wasLandscape = window.innerHeight <= 500 && window.matchMedia('(orientation: landscape)').matches;
  
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const isMobile = window.innerWidth <= 480;
      const isLandscape = window.innerHeight <= 500 && window.matchMedia('(orientation: landscape)').matches;
      
      // 切換到手機模式或橫向模式時關閉PiP
      if ((isMobile && !wasMobile) || (isLandscape && !wasLandscape)) {
        const togglePipCheckbox = document.getElementById('togglePip');
        togglePipCheckbox.checked = false;
        pip.style.display = 'none';
      }
      
      // 切換到桌面模式且非橫向時開啟PiP
      if (!isMobile && wasMobile && !isLandscape) {
        const togglePipCheckbox = document.getElementById('togglePip');
        togglePipCheckbox.checked = true;
        pip.style.display = 'block';
      }
      
      wasMobile = isMobile;
      wasLandscape = isLandscape;
      
      // 確保PiP在螢幕內
      const rect = pip.getBoundingClientRect();
      if (rect.right > window.innerWidth) {
        pip.style.left = (window.innerWidth - pip.offsetWidth - 14) + 'px';
        pip.style.right = '';
      }
      if (rect.bottom > window.innerHeight - panelHeight) {
        pip.style.top = (window.innerHeight - pip.offsetHeight - panelHeight - 14) + 'px';
        pip.style.bottom = '';
      }
      
      // 手機版與橫向模式自動關閉面板
      if (window.innerWidth > 480 && !isLandscape) {
        panel.classList.remove('show');
      }
    }, 250);
  });

  // 初始化
  window.addEventListener('load', () => {
    const isLandscape = window.innerHeight <= 500 && window.matchMedia('(orientation: landscape)').matches;
    
    // 手機模式或橫向模式下預設關閉PiP
    if (window.innerWidth <= 480 || isLandscape) {
      const togglePipCheckbox = document.getElementById('togglePip');
      togglePipCheckbox.checked = false;
      pip.style.display = 'none';
    }
    
    // 確保PiP在可見區域
    const rect = pip.getBoundingClientRect();
    if (rect.right > window.innerWidth || rect.bottom > window.innerHeight) {
      resetPin();
      pip.style.right = '14px';
      pip.style.bottom = (panelHeight + 14) + 'px';
    }
  });

  // 外部可呼叫動作 (保留原有功能)
  function CubeAction(){ setSrc('前叉A.html'); }
  function ConeLAction(){ setSrc('車架.html'); }
  function ConeRAction(){ setSrc('控制台.html'); }
  function SuzanneAction(){ setSrc('椅子.html'); }
  window.CubeAction = CubeAction;
  window.ConeLAction = ConeLAction;
  window.ConeRAction = ConeRAction;
  window.SuzanneAction = SuzanneAction;
</script>

<script>
// === ChatGPT Inject v5: receive Ep014 postMessage and trigger PiP actions ===
(function(){
  function onMsg(event){
    const data = event && event.data;
    if (!data || data.type !== 'Ep014Select') return;
    const v = data.value;
    console.log('[1101Pip_PU RWD v5] 收到 Ep014Select:', v);
    try {
      if (v === 'Cube' && typeof window.CubeAction === 'function') return void window.CubeAction();
      if (v === 'ConeL' && typeof window.ConeLAction === 'function') return void window.ConeLAction();
      if (v === 'ConeR' && typeof window.ConeRAction === 'function') return void window.ConeRAction();
      if (v === 'Suzanne' && typeof window.SuzanneAction === 'function') return void window.SuzanneAction();
      console.log('[1101Pip_PU RWD v5] 未對應的 value:', v);
    } catch(e){ console.warn(e); }
  }
  window.addEventListener('message', onMsg, false);
  console.log('[1101Pip_PU RWD v5] 已啟用 postMessage 接收器');
})();
</script>

<script>
// === Object Selection Integration: receive ObjectSelected from Push-1101.html ===
(function(){
  // Object name to HTML file mapping
  const objectToFileMap = {
    '前叉': '前叉A.html',
    '車架': '車架.html',
    '控制台': '控制台.html',
    '椅子': '椅子.html',
    '腳踏': '腳踏.html',
    '背車殼': '背車殼.html',
    '前右輪': '1019Pip_前右輪.html',
    '前左輪': '1019Pip_前左輪.html',
    '後右輪': '後右輪.html',
    '後左輪': '後左輪.html'
  };

  function onObjectSelected(event){
    const data = event && event.data;
    if (!data || data.type !== 'ObjectSelected') return;
    
    const objectName = data.objectName;
    console.log('[1101Pip_PU RWD] 收到 ObjectSelected:', objectName);
    
    if (!objectName) {
      console.log('[1101Pip_PU RWD] 物件取消選擇');
      return;
    }
    
    // Try to match the object name with our file mapping
    let matchedFile = null;
    
    // Exact match first
    if (objectToFileMap[objectName]) {
      matchedFile = objectToFileMap[objectName];
    } else {
      // Partial match - check if object name contains any key
      for (const key in objectToFileMap) {
        if (objectName.includes(key) || key.includes(objectName)) {
          matchedFile = objectToFileMap[key];
          break;
        }
      }
    }
    
    if (matchedFile) {
      console.log('[1101Pip_PU RWD] 切換 PiP 到:', matchedFile);
      setSrc(matchedFile);
      
      // Make sure PiP is visible
      const togglePipCheckbox = document.getElementById('togglePip');
      if (togglePipCheckbox && !togglePipCheckbox.checked) {
        togglePipCheckbox.checked = true;
        document.getElementById('pip').style.display = 'block';
      }
    } else {

    }
  }
  
  window.addEventListener('message', onObjectSelected, false);

})();
